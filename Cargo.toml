[package]
name = "petrov"
version = "0.1.0"
authors = ["hill <hill@hilll.dev>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/float3/petrov"

[build-dependencies]
rooms-client = { git = "https://github.com/float3/rooms" }

[dependencies]
axum = "0.8"
rand = "0.10"
rooms = { git = "https://github.com/float3/rooms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
argon2 = "0.6"
