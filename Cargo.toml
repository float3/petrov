[package]
name = "petrov"
version = "0.1.0"
authors = ["hill <hill@hilll.dev>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/float3/petrov"

[dependencies]
axum = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs"] }
tokio-stream = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
